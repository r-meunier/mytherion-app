spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mytheriondb}
    username: ${POSTGRES_USER:mytherion}
    password: ${POSTGRES_PASSWORD:mytherion}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  servlet:
    multipart:
      # The single source of truth for upload size. Oversized files are rejected while the
      # request is parsed, before any controller runs, and GlobalExceptionHandler returns
      # 413 FILE_TOO_LARGE quoting this value. The frontend's pre-upload check
      # (MEDIA_CONSTRAINTS in mediaService.ts) mirrors the default; the contract parity
      # check fails CI if the two defaults drift.
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:5MB}
      # Whole multipart request: the file plus form fields and boundaries. Keep it above
      # max-file-size, or a file just under the limit is rejected anyway.
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:6MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: mytherion-backend
      environment: ${ENVIRONMENT:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework: info

app:
  security:
    jwt:
      secret: "change-me-to-a-long-random-secret-at-least-32-chars"
      access-token-minutes: 60
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3001}
  email:
    from: ${EMAIL_FROM:noreply@mytherion.com}

# MinIO Configuration (can be swapped for S3 in production)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:mytherion-uploads}
